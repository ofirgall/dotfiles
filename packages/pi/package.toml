schema = 1
name = "pi"
description = "pi coding agent (npm, install scripts disabled) + settings and keybindings"
bin = "pi"
requires = ["node", { name = "herdr", when = 'not(tag = "sandbox")' }]

# TODO(dots-migration): replace with the built-in `npm` provider (task 7.1, gap G13: no per-package
# --ignore-scripts option, so this stays a script)
[providers.script]
check   = "command -v pi"
version = "pi --version | awk '{print $NF}'"
install = "npm install -g --ignore-scripts @earendil-works/pi-coding-agent"
lock    = "pi"

# pi rewrites settings.json (packages list, changelog versions), so both stay links
[[files]]
src = "settings.json"
dst = "~/.pi/agent/settings.json"

[[files]]
src = "keybindings.json"
dst = "~/.pi/agent/keybindings.json"

# herdr agent-state integration for pi (needs herdr, which pi requires outside sandboxes)
[hooks]
post_install = 'if [ -z "${DOTS_TAG_SANDBOX:-}" ] && command -v herdr >/dev/null; then herdr integration install pi; fi'

# Windows: the bash check/install above need /bin/bash; same steps in PowerShell.
[platform.windows.providers.script]
shell   = "pwsh"
check   = 'if (Get-Command pi -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }'
version = "(pi --version) -split ' ' | Select-Object -Last 1"
install = "npm install -g --ignore-scripts @earendil-works/pi-coding-agent; exit $LASTEXITCODE"

# herdr agent-state integration for pi (needs herdr, which pi requires outside sandboxes)
[platform.windows.hooks]
post_install = 'if ((-not $env:DOTS_TAG_SANDBOX) -and (Get-Command herdr -ErrorAction SilentlyContinue)) { herdr integration install pi }'
