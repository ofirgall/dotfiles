schema = 1
name = "gh-stack"
description = "gh stack"
when = 'not(tag = "sandbox")'
providers_only = true
requires = ["gh"]

# Needs gh auth / the API, so not in sandboxes.
# TODO(dots-migration): `gh-ext` provider (task 7.11). It is skipped at plan time while `gh` is not yet
# installed (dots does not bootstrap it: dots bug 7), so this is a script.
[providers.script]
check       = "gh extension list | awk -F'\\t' '$2==\"github/gh-stack\"{f=1} END{exit !f}'"
version     = "gh extension list | awk -F'\\t' '$2==\"github/gh-stack\"{print $3}'"
install     = "gh extension install github/gh-stack"

