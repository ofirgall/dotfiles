schema = 1
name = "pi-subagents"
description = "pi subagents extension"
requires = ["pi"]

# TODO(dots-migration): use the `pi-package` provider from dots.toml once it can serialize: three
# concurrent `pi install` calls rewrite ~/.pi/agent/settings.json and lose entries (dots bug 16), and only
# `[providers.script] lock` serializes, so these stay scripts sharing `lock = "pi"`.
[providers.script]
check       = "pi list 2>/dev/null | grep -qxF '  npm:pi-subagents'"
versionless = true
install     = "pi install npm:pi-subagents"
lock        = "pi"

# Windows: the bash check/install above need /bin/bash; same steps in PowerShell.
[platform.windows.providers.script]
shell   = "pwsh"
check   = 'if ((pi list 2>$null) -contains "  npm:pi-subagents") { exit 0 } else { exit 1 }'
install = "pi install npm:pi-subagents; exit $LASTEXITCODE"
