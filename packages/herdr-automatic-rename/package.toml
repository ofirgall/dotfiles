schema = 1
name = "herdr-automatic-rename"
description = "auto-name tabs and workspaces"
when = 'not(tag = "sandbox")'
requires = ["herdr"]

# TODO(dots-migration): replace with the `herdr-plugin` provider (task 7.11, gap G6). The interim
# custom provider in dots.toml can't be used: a custom spec has no `source`, and `herdr plugin
# list` reports the plugin id while the install wants owner/repo, so status would always say
# `missing`. This script matches by plugin id instead (also `ok` for local-link installs).
[providers.script]
check       = "herdr plugin list 2>/dev/null | grep -q '^- herdr-automatic-rename ('"
versionless = true
install     = "herdr plugin install ofirgall/herdr-automatic-rename --yes"

# TODO(dots-migration): dst = "{plugin_config}/config.sh" when the herdr-plugin provider lands
# (task 7.11). The plugin also reads ~/.config/herdr-automatic-rename/config.sh, which is where
# the old dotbot link pointed.
[[files]]
src = "config.sh"
dst = "~/.config/herdr-automatic-rename/config.sh"
