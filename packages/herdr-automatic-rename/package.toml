schema = 1
name = "herdr-automatic-rename"
description = "auto-name tabs and workspaces"
when = 'not(tag = "sandbox")'
requires = ["herdr"]

# TODO(dots-migration): replace with the bundled `herdr-plugin` definition (task 7.11): --json, --ref pinning, local link.
[providers.herdr-plugin]
name   = "herdr-automatic-rename"
source = "ofirgall/herdr-automatic-rename"

# TODO(dots-migration): dst = "{plugin_config}/config.sh" when the herdr-plugin provider lands
# (task 7.11). The plugin also reads ~/.config/herdr-automatic-rename/config.sh, which is where
# the old dotbot link pointed.
[[files]]
src = "config.sh"
dst = "~/.config/herdr-automatic-rename/config.sh"
