schema = 1
name = "herdr-reviewr"
description = "review agent diffs (installed id persiyanov.reviewr)"
when = 'not(tag = "sandbox")'
requires = ["herdr"]

# TODO(dots-migration): replace with the bundled `herdr-plugin` definition (task 7.11): --json, --ref pinning, local link.
# The installed id is `persiyanov.reviewr`; the install source is the ofirgall fork.
[providers.herdr-plugin]
name   = "persiyanov.reviewr"
source = "ofirgall/herdr-reviewr"

# Windows: the `herdr-plugin` custom provider runs through /bin/sh, which Windows does not have.
# TODO(dots-windows): drop this once the built-in `herdr-plugin` provider (task 7.11) runs on Windows.
[platform.windows.providers.script]
shell       = "pwsh"
versionless = true
check       = 'if ((herdr plugin list 2>$null) -match "^- persiyanov\.reviewr \(") { exit 0 } else { exit 1 }'
install     = "herdr plugin install ofirgall/herdr-reviewr --yes; exit $LASTEXITCODE"
