schema = 1
name = "pi-community-themes"
description = "community themes for pi"
requires = ["pi"]

# TODO(dots-migration): use the `pi-package` provider from dots.toml once it can serialize: three
# concurrent `pi install` calls rewrite ~/.pi/agent/settings.json and lose entries (dots bug 16), and only
# `[providers.script] lock` serializes, so these stay scripts sharing `lock = "pi"`.
[providers.script]
check       = "pi list 2>/dev/null | grep -qxF '  git:https://github.com/hasit/pi-community-themes'"
versionless = true
install     = "pi install git:https://github.com/hasit/pi-community-themes"
lock        = "pi"

# Windows: the bash check/install above need /bin/bash; same steps in PowerShell.
[platform.windows.providers.script]
shell   = "pwsh"
check   = 'if ((pi list 2>$null) -contains "  git:https://github.com/hasit/pi-community-themes") { exit 0 } else { exit 1 }'
install = "pi install git:https://github.com/hasit/pi-community-themes; exit $LASTEXITCODE"
