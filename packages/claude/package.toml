schema = 1
name = "claude"
description = "Claude Code config: settings, keybindings, statusline, local plugin marketplace"
requires = ["claude-code"]

# The app rewrites settings.json, so it stays a link: edits land in the repo.
[[files]]
src  = "settings.json"
dst  = "~/.claude/settings.json"
when = 'not(os = "windows")'

# Windows: the SessionStart hook differs (settings.json has the macOS bash one, with a /Users path), so
# the file is rendered: settings.windows.json replaces the base `hooks.SessionStart` array (arrays replace).
# TODO(dots-windows): a render is a generated file, so the app's own edits to settings.json do not land in the
# repo as they do with the link. Wanted: a per-OS link source (`src = { default = ..., windows = ... }`) or a
# json fragment mode. The hook path is the PC's user dir (herdr integration writes it); `~` is not expanded
# by `powershell -File`.
[[files]]
mode   = "render"
format = "json"
dst    = "~/.claude/settings.json"
when   = 'os = "windows"'
layers = ["settings.json", "settings.windows.json"]

[[files]]
src = "keybindings.json"
dst = "~/.claude/keybindings.json"

[[files]]
src = "statusline-command.sh"
dst = "~/.claude/statusline-command.sh"

# settings.json `extraKnownMarketplaces.ofir-mods.source.path` points here (was an absolute repo path).
# TODO(dots-migration): verify Claude expands `~` in that path, else render settings.json with a
# `[[files.set]]` for it (task 5.4 / gap G18)
[[files]]
src = "mods"
dst = "~/.claude/mods"
