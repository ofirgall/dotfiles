schema = 1
name = "karabiner"
description = "Karabiner-Elements keyboard remapper (karabiner.json is link: the app rewrites it)"
when = 'os = "macos"'

[providers.brew]
name = "karabiner-elements"
cask = true

[[files]]
src = "karabiner.json"
dst = "~/.config/karabiner/karabiner.json"
mode = "link"

# post_files nudges Karabiner's file watcher after the link changes; post_install launches the app
# once (permissions and first launch: manual/permissions.md).
[hooks]
post_install = "open -a Karabiner-Elements"
post_files   = "touch -h ~/.config/karabiner/karabiner.json"
