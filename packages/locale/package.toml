schema = 1
name = "locale"
description = "en_US.UTF-8 locale (zsh-conf exports LC_ALL=en_US.UTF-8; containers ship without it)"
when = 'os = "linux"'
requires = ["locales"]    # apt must be done first: the script runs apt-free, dpkg's lock is exclusive

[providers.script]
check       = "locale -a | grep -qix 'en_US.utf-\\?8'"
versionless = true
needs_root  = true
install     = "locale-gen en_US.UTF-8"
