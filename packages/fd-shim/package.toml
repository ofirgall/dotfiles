schema = 1
name = "fd-shim"
description = "~/.local/bin/fd -> fdfind (Debian's name for fd)"
when = 'os = "linux"'
requires = ["fd"]

# TODO(dots-migration): delete this package once dots creates provider `shim`s (dots bug 5);
# `[providers.apt] shim = "fd"` on `fd` already declares it.
[providers.script]
check       = "command -v fd >/dev/null"
versionless = true
install     = "mkdir -p \"$HOME/.local/bin\" && ln -sf \"$(command -v fdfind)\" \"$HOME/.local/bin/fd\""
