schema = 1
name = "ghostty-shaders"
description = "Cursor shaders for Ghostty (config.macos uses shaders/cursor_warp.glsl)"
when = 'gui'
requires = ["git"]

# TODO(dots-migration): replace with file `mode = "git"` once dots-files resolves it (gap G1)
[providers.script]
check   = 'test -d "$HOME/.config/ghostty/shaders/.git"'
version = 'git -C "$HOME/.config/ghostty/shaders" rev-parse --short HEAD'
latest  = 'git ls-remote https://github.com/ofirgall/ghostty-cursor-shaders HEAD | cut -c1-7'
install = '''
mkdir -p "$HOME/.config/ghostty"
if [ -d "$HOME/.config/ghostty/shaders/.git" ]; then
  git -C "$HOME/.config/ghostty/shaders" pull --ff-only
else
  rm -rf "$HOME/.config/ghostty/shaders"
  git clone https://github.com/ofirgall/ghostty-cursor-shaders "$HOME/.config/ghostty/shaders"
fi
'''
