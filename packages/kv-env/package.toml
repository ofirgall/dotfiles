schema = 1
name = "kv-env"
description = "The `main` kv env (its own nvim, node and tools): `kv install`"
when = 'not(tag = "sandbox")'
requires = ["kv", "koala-config", "git", "curl"]

# Not in sandboxes: `kv install` fails on linux/aarch64 ("neovim: Failed to copy binary: the source path is
# neither a regular file nor a symlink", a kv bug seen in Docker).
[providers.script]
check       = "test -x $HOME/.local/share/kvim-envs/main/kv/bin/nvim"
versionless = true
install     = "kv install"
timeout     = "30m"

# Windows: `kv install` for the `main` env (the koala-config link supplies ~/.config/kvim-envs/main), same as above.
# kv keeps an env's data in %LOCALAPPDATA%\kvim-envs\<env>-data on Windows (seen on the PC).
# TODO(kv): kv finds pacman-installed deps with `which`, which returns an MSYS path (/usr/bin/fzy) that
# Windows reports as missing, so `kv install` fails on fzy even after pacman installed it.
[platform.windows]
requires = ["kv", "koala-config", "git"]    # no curl on Windows

[platform.windows.providers.script]
shell   = "pwsh"
check   = "if (Test-Path \"$env:LOCALAPPDATA\\kvim-envs\\main-data\\kv\\bin\\nvim.exe\") { exit 0 } else { exit 1 }"
# kv installs fzy with MSYS2's pacman (`pacman -S fzy`), which is not on PATH.
install = '''
if (Test-Path 'C:\msys64\usr\bin\pacman.exe') { $env:PATH = "C:\msys64\usr\bin;$env:PATH" }
kv install; exit $LASTEXITCODE
'''
