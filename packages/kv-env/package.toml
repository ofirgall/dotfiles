schema = 1
name = "kv-env"
description = "The `main` kv env (its own nvim, node and tools): `kv install`"
when = 'not(tag = "sandbox")'
requires = ["kv", "koala-config", "git", "curl"]

# Not in sandboxes: `kv install` fails on linux/aarch64 ("neovim: Failed to copy binary: the source path is
# neither a regular file nor a symlink", a kv bug seen in Docker).
[providers.script]
check       = "test -x $HOME/.local/share/kvim-envs/main/kv/bin/nvim"
versionless = true
install     = "kv install"
timeout     = "30m"
