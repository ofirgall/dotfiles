schema = 1
name = "sublime-apt-repo"
description = "apt source + key for Sublime's flat repository"
when = 'all(os = "linux", gui)'
requires = ["curl"]

# dots bug 7: apt `repo` has no flat-repo form (components are mandatory and Sublime's
# `deb https://download.sublimetext.com/ apt/stable/` has none), so a script writes the source.
# TODO(dots-migration): replace with `[providers.apt] repo = ...` once flat repos work.
# TODO(dots-migration): needs_root = true once dots bug 4 is fixed; sudo is inline until then.
[providers.script]
check       = 'test -f /etc/apt/sources.list.d/sublime-text.sources && test -f /etc/apt/keyrings/sublimehq-pub.asc'
versionless = true
install     = '''
if [ "$(id -u)" = 0 ]; then S=""; else S="sudo -n"; fi
tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
curl -fsSL https://download.sublimetext.com/sublimehq-pub.gpg -o "$tmp/key.asc"
$S install -D -m 0644 "$tmp/key.asc" /etc/apt/keyrings/sublimehq-pub.asc
printf 'Types: deb\nURIs: https://download.sublimetext.com/\nSuites: apt/stable/\nSigned-By: /etc/apt/keyrings/sublimehq-pub.asc\n' > "$tmp/src"
$S install -m 0644 "$tmp/src" /etc/apt/sources.list.d/sublime-text.sources
# refresh just this source. dots' own apt batch can hold the lists lock (apt has no timeout option
# for it), so retry for up to ~10 minutes.
for i in $(seq 1 60); do
  if $S apt-get update -o Dir::Etc::sourcelist=sources.list.d/sublime-text.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0; then ok=1; break; fi
  sleep 10
done
[ "${ok:-}" = 1 ]
'''
