schema = 1
name = "macos-defaults"
description = "macOS preferences from setup_once.sh, as [[defaults]] (read before write, drift visible)"
when = 'os = "macos"'

# Key repeat, ~matching Hyprland. Takes effect after logout.
[[defaults]]
domain   = "NSGlobalDomain"
key      = "InitialKeyRepeat"
value    = 13
requires = ["logout"]

[[defaults]]
domain   = "NSGlobalDomain"
key      = "KeyRepeat"
value    = 2
requires = ["logout"]

# Fn lock: F1-F12 are standard function keys (media controls need Fn)
[[defaults]]
domain = "NSGlobalDomain"
key    = "com.apple.keyboard.fnState"
value  = true

# Hide the native menu bar (replaced by SketchyBar)
[[defaults]]
domain = "NSGlobalDomain"
key    = "_HIHideMenuBar"
value  = true

# Tap to click
[[defaults]]
domain = "com.apple.AppleMultitouchTrackpad"
key    = "Clicking"
value  = true

# Tap and drag without drag lock (Accessibility > Pointer Control > Trackpad Options)
[[defaults]]
domain = "com.apple.AppleMultitouchTrackpad"
key    = "Dragging"
value  = true

[[defaults]]
domain = "com.apple.AppleMultitouchTrackpad"
key    = "DragLock"
value  = false

# Tap and drag without drag lock (Accessibility > Pointer Control > Trackpad Options)
[[defaults]]
domain = "com.apple.driver.AppleBluetoothMultitouch.trackpad"
key    = "Dragging"
value  = true

[[defaults]]
domain = "com.apple.driver.AppleBluetoothMultitouch.trackpad"
key    = "DragLock"
value  = false

# Hotkeys that conflict with Raycast, tmux or aerospace. A dotted key edits one entry of the dict.
# 64/65/60/61 keep the script's value dict. 28-31 and 184 declare only `enabled`: macOS normalised their
# `parameters` (65535 -> 51/52/53, the key's character code), so the script's parameters would show as
# permanent drift. On this Mac 64/65/60/61 are stored as strings by the old script; dots writes real types.

# Spotlight search (Cmd+Space)
[[defaults]]
domain = "com.apple.symbolichotkeys"
key    = "AppleSymbolicHotKeys.64"
value  = { enabled = false, value = { type = "standard", parameters = [32, 49, 1048576] } }

# Finder search (Cmd+Alt+Space)
[[defaults]]
domain = "com.apple.symbolichotkeys"
key    = "AppleSymbolicHotKeys.65"
value  = { enabled = false, value = { type = "standard", parameters = [32, 49, 1572864] } }

# Previous input source (Ctrl+Space)
[[defaults]]
domain = "com.apple.symbolichotkeys"
key    = "AppleSymbolicHotKeys.60"
value  = { enabled = false, value = { type = "standard", parameters = [32, 49, 262144] } }

# Next input source (Ctrl+Alt+Space)
[[defaults]]
domain = "com.apple.symbolichotkeys"
key    = "AppleSymbolicHotKeys.61"
value  = { enabled = false, value = { type = "standard", parameters = [32, 49, 393216] } }

# Screenshot: whole screen to file (Cmd+Shift+3)
[[defaults]]
domain = "com.apple.symbolichotkeys"
key    = "AppleSymbolicHotKeys.28"
value  = { enabled = false }

# Screenshot: whole screen to clipboard
[[defaults]]
domain = "com.apple.symbolichotkeys"
key    = "AppleSymbolicHotKeys.29"
value  = { enabled = false }

# Screenshot: selection to file (Cmd+Shift+4)
[[defaults]]
domain = "com.apple.symbolichotkeys"
key    = "AppleSymbolicHotKeys.30"
value  = { enabled = false }

# Screenshot: selection to clipboard
[[defaults]]
domain = "com.apple.symbolichotkeys"
key    = "AppleSymbolicHotKeys.31"
value  = { enabled = false }

# Screenshot and recording options (Cmd+Shift+5)
[[defaults]]
domain = "com.apple.symbolichotkeys"
key    = "AppleSymbolicHotKeys.184"
value  = { enabled = false }

[[defaults]]
domain  = "com.apple.dock"
key     = "autohide"
value   = true
restart = ["Dock"]

# Cursor: size 1.75x, white fill, black outline. The user's own domain: the old script used
# `sudo defaults write`, which wrote root's preferences and never changed the user's cursor.
# Writing com.apple.universalaccess may need Full Disk Access for the terminal.
[[defaults]]
domain = "com.apple.universalaccess"
key    = "mouseDriverCursorSize"
value  = 1.75

[[defaults]]
domain = "com.apple.universalaccess"
key    = "cursorFill"
value  = { alpha = 1.0, blue = 1.0, green = 1.0, red = 1.0 }

[[defaults]]
domain = "com.apple.universalaccess"
key    = "cursorOutline"
value  = { alpha = 1.0, blue = 0.0, green = 0.0, red = 0.0 }

# TODO(dots-migration): setup_once.sh also ran
#   /System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u
# to apply hotkey changes without logout. Hooks never run (dots bug 6) and a stateless script has no
# honest `check`, so it is not reproduced: log out once, or run it by hand (manual/apply-hotkeys.md).
