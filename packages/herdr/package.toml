schema = 1
name = "herdr"
description = "herdr terminal workspace manager (ofirgall fork): rendered config, agent-detection rules, terminfo"
bin = "herdr"
requires = ["rustup", "herdr-zig"]

[providers.cargo]
git = "https://github.com/ofirgall/herdr"
# Head of the fork-v0.9.x branch (the default branch is upstream master, 0.8.x).
# dots cargo has no `branch =` yet: bump this rev to update herdr.
rev = "664400008b1118feb7d05fd942e42428d64e949e"

# ~/.config/herdr is a REAL directory owned by herdr (sockets, logs, sessions, plugins/,
# plugins.json, .locks/ all land there). Only the entries below are managed by dots, so the repo
# never receives runtime files again. Cutover: manual/split-runtime-dir.md

# config.toml = common + mac (macOS) or + windows (Windows, in %APPDATA%\herdr). The pre-dots generator (yq `*+`) appended arrays, and mac.toml adds
# [[keys.command]] entries (sidekick keys), so keys.command is appended; the default for arrays is replace.
[[files]]
mode   = "render"
format = "toml"
dst    = { default = "~/.config/herdr/config.toml", windows = "~/AppData/Roaming/herdr/config.toml" }
layers = ["config/common.toml", { src = "config/mac.toml", when = 'os = "macos"' }, { src = "config/windows.toml", when = 'os = "windows"' }]

[files.merge]
"keys.command" = "append"

# Second render for the dev herdr (`make run` in the fork), not on Windows (its dev output was never linked
# there). dev.toml sets no keys today, so none
# of the four old DEV_REPLACE_PATHS (ui.sidebar.spaces.rows, ui.sidebar.spaces.agent_rows,
# ui.sidebar.agents.rows, ui.status_icons.working) needs a [files.merge] entry yet; add
# `"<path>" = "replace"` (the dots default for arrays) when dev.toml starts setting them.
[[files]]
mode   = "render"
format = "toml"
dst    = "~/.config/herdr/config-dev.generated.toml"
when   = 'not(os = "windows")'
layers = ["config/common.toml", { src = "config/mac.toml", when = 'os = "macos"' }, "config/dev.toml"]

[files.merge]
"keys.command" = "append"

# Unix only: the agent-detection rules and bash scripts were never linked on Windows, and there is no terminfo.
[[files]]
src  = "agent-detection"
dst  = "~/.config/herdr/agent-detection"
when = 'not(os = "windows")'

[[files]]
src  = "scripts"
dst  = "~/.config/herdr/scripts"
when = 'not(os = "windows")'

# undercurl support
[[files]]
mode = "terminfo"
src  = "herdr-256color.terminfo"
when = 'not(os = "windows")'
