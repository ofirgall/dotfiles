schema = 1
name = "xdg-defaults"
description = "Default apps: markdown -> gh markdown-preview, browser -> hypr-browser"
when = 'all(os = "linux", gui)'
requires = ["desktop-apps", "xdg-utils"]

[[xdg]]
mime = ["text/markdown"]
app  = "gh-markdown-preview.desktop"

[[xdg]]
setting = "default-web-browser"
value   = "hypr-browser.desktop"
