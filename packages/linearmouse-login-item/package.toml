schema = 1
name = "linearmouse-login-item"
description = "Register LinearMouse as a login item (it does not enable its own)"
when = 'os = "macos"'
requires = ["linearmouse"]

# TODO(dots-migration): convert to linearmouse hook post_install when dots runs hooks (dots bug 6)
[providers.script]
check       = "osascript -e 'tell application \"System Events\" to exists login item \"LinearMouse\"' | grep -qx true"
versionless = true
install     = "osascript -e 'tell application \"System Events\" to if not (exists login item \"LinearMouse\") then make login item at end with properties {path:\"/Applications/LinearMouse.app\", hidden:true}'"
