schema = 1
name = "codex"
description = "OpenAI Codex CLI: brew cask on macOS, npm on Linux"
bin = "codex"
requires = [{ name = "node", when = 'os = "linux"' }]

[providers.brew]
cask = true
when = 'os = "macos"'

# TODO(dots-migration): replace with the built-in `npm` provider (task 7.1, gap G2)
[providers.npm-g]
name = "@openai/codex"
when = 'os = "linux"'

[[files]]
src = "config.toml"
dst = "~/.codex/config.toml"
