schema = 1
name = "font-caskaydia-cove-prune"
description = "macOS: remove the Caskaydia custom italic fonts the cask installs"
when = 'os = "macos"'
requires = ["font-caskaydia-cove"]

# TODO(dots-migration): hook post_install of font-caskaydia-cove (dots bug 6)
[providers.script]
check       = '! ls "$HOME"/Library/Fonts/Caskaydia*Italic* >/dev/null 2>&1'
versionless = true
install     = 'rm -f "$HOME"/Library/Fonts/Caskaydia*Italic*'
