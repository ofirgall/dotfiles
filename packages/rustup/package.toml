schema = 1
name = "rustup"
description = "Rust toolchain: brew `rust` on macOS (what is installed there), winget rustup on Windows, rustup elsewhere"
bin = "cargo"
# every cargo package needs a C compiler/linker to build crates with build scripts
requires = [{ name = "build-essential", when = 'os = "linux"' }, { name = "vcbuildtools", when = 'os = "windows"' }]

[providers.brew]
name = "rust"

[providers.script]
when    = 'os = "linux"'
check   = "test -x $HOME/.cargo/bin/cargo"
version = "$HOME/.cargo/bin/rustc --version | awk '{print $2}'"
install = "sh {fetched} -y --no-modify-path"
fetch   = { url = "https://sh.rustup.rs" }

[env]
path = ["~/.cargo/bin"]

[providers.winget]
id = "Rustlang.Rustup"
