schema = 1
name = "taskwarrior"
description = "Taskwarrior + ~/.taskrc and the add-* shortcut scripts"
when = 'all(os = "linux", gui)'
bin = "task"

# The old installer built taskwarrior 3 from source; apt provides 2.6 (TODO: taskwarrior 3 from source if the
# data format matters). taskwarrior-tui and taskopen are their own packages.
[providers.apt]
name = "taskwarrior"

[[files]]
src = "taskrc"
dst = "~/.taskrc"

[[files]]
src = "taskwarrior_shortcuts"
dst = "~/.taskwarrior_shortcuts"
