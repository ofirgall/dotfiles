schema = 1
name = "igrep"
bin = "ig"
providers_only = true

[providers.brew]

# crates.io igrep 1.2.0 doesn't build with current rustc (its locked `time` crate, E0282; also
# unlocked). Upstream main (1.3.0) does, so cargo installs from git.
[providers.cargo]
git = "https://github.com/konradsz/igrep"
locked = false
