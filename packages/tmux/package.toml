schema = 1
name = "tmux"
description = "tmux + config. Linux: apt 3.4 (the old from-source build isn't worth it)."
bin = "tmux"
providers_only = true
requires = ["tpm", "libtmux", "ruby"]
# TODO(dots-migration): if the conf needs tmux >= 3.5 on Linux, add a script provider that builds it.

[providers.brew]
[providers.apt]

[[files]]
src = "tmux_conf/entrypoint.tmux"
dst = "~/.tmux.conf"

[[files]]
src = "tmux_conf"
dst = "~/.tmux_conf"

[[files]]
src = "tmux_conf/custom-macros"
dst = "~/.tmux/custom-macros"

# macOS ships terminfo without extended caps (Smulx, Setulc): compile Homebrew's tmux-256color
# (generated once with `infocmp -x tmux-256color` from brew's ncurses).
[[files]]
mode = "terminfo"
src  = "tmux-256color.terminfo"
when = 'os = "macos"'

# tmux's stock bindings (the reload script unbinds plugin keys with them), written once after install.
# tpm's install_plugins, after the files phase linked ~/.tmux.conf: install-plugins.sh clones what the
# `set -g @plugin` lines of plugins.tmux name (no tmux server needed, so it exits 0 in Docker).
[hooks]
post_install = "default-keys.sh"
post_files   = "install-plugins.sh"
