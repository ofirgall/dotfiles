schema = 1
name = "scripts"
description = "~/dotfiles_scripts and the python venv its scripts use"
requires = ["uv", "python3"]

[[files]]
src = "scripts"
dst = "~/dotfiles_scripts"

# uv-managed venv at ~/.local/share/dots/venvs/scripts (what the scripts' shebangs expect)
[providers.uv]
kind = "venv"
requirements = "requirements.txt"
