schema = 1
name = "herdr-collie"
description = "Collie mobile client bridge for herdr (macOS)"
when = 'all(os = "macos", not(tag = "sandbox"))'
requires = ["herdr", "scripts"]

# TODO(dots-migration): replace with the bundled `herdr-plugin` definition (task 7.11): --json, --ref pinning, local link.
[providers.herdr-plugin]
name   = "herdr.collie"
source = "AltanS/collie"

# Setup (.env, push keys, start) is the herdr-collie-setup package, so it shows as pending until
# it has run, also when this plugin was installed outside dots (adopted packages skip hooks).
