schema = 1
name = "fusuma"
description = "Touchpad gestures (ruby gem)"
when = 'all(os = "linux", gui)'
bin = "fusuma"
requires = ["libinput-tools", "ruby", "libevdev-dev", "ruby-dev", "build-essential"]

[providers.script]
needs_root = true
check   = 'command -v fusuma >/dev/null && gem list -i fusuma-plugin-sendkey >/dev/null'
version = "gem list -e fusuma | sed -E 's/.*\\(([^)]+)\\).*/\\1/' | head -1"
install = '''
gem install fusuma revdev bundler fusuma-plugin-sendkey
'''

[[files]]
src = "fusuma.yml"
dst = "~/.config/fusuma/config.yml"
