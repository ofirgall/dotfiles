schema = 1
name = "node"
description = "Node.js + npm: brew on macOS; Linux uses `n` into ~/.local/n (no sudo)"
bin = "node"
providers_only = true
requires = [{ name = "curl", when = 'os = "linux"' }, { name = "libatomic1", when = 'os = "linux"' }]

[providers.brew]

# The old installer: apt npm, `npm i -g n`, `sudo n stable`. Now `n` runs from its fetched script.
# TODO(dots-migration): replace with archive provider (task 7.1, ARCH §5.2.5)
[providers.script]
when    = 'os = "linux"'
check   = "test -x $HOME/.local/n/bin/node && test -x $HOME/.local/n/bin/npm"
version = "$HOME/.local/n/bin/node --version | sed 's/^v//'"
install = "N_PREFIX=$HOME/.local/n bash {fetched} stable"
fetch   = { url = "https://raw.githubusercontent.com/tj/n/master/bin/n" }

[env]
path = ["~/.local/n/bin"]

[providers.winget]
id = "OpenJS.NodeJS.LTS"
