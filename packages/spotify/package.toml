schema = 1
name = "spotify"
description = "Spotify client from Spotify's apt repo"
when = 'all(os = "linux", gui)'
bin = "spotify"

# The repo is signed with key 5384CE82BA52C83A now (the old script's C85668DF69375001 fails `apt update`).
# Spotify publishes it only as a binary (dearmored) .gpg: dots accepts that and verifies the fingerprint.

[providers.apt]
name = "spotify-client"
repo = { url = "https://repository.spotify.com", suite = "stable", components = ["non-free"], key = "https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.gpg", fingerprint = "E1096BCBFF6D418796DE78515384CE82BA52C83A" }
