schema = 1
name = "alacritty-desktop"
description = "x-terminal-emulator alternative + .desktop entry so launchers (rofi) find alacritty"
when = 'all(os = "linux", gui)'
requires = ["alacritty", "desktop-file-utils", "curl"]

# Root steps, so a needs_root script rather than a post_install hook of alacritty (hooks run unprivileged).
# sudo resets HOME to /root, so the user's cargo bin dir comes from SUDO_USER.
[providers.script]
needs_root  = true
check       = 'test -L /usr/local/bin/alacritty && test -f /usr/share/applications/Alacritty.desktop && update-alternatives --query x-terminal-emulator 2>/dev/null | grep -q "alacritty"'
versionless = true
install     = '''
U_HOME=$(getent passwd "${SUDO_USER:-root}" | cut -d: -f6)
ln -sf "$U_HOME/.cargo/bin/alacritty" /usr/local/bin/alacritty
update-alternatives --install /usr/bin/x-terminal-emulator x-terminal-emulator "$U_HOME/.cargo/bin/alacritty" 100
tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
raw=https://raw.githubusercontent.com/alacritty/alacritty/master/extra
curl -fsSL -o "$tmp/Alacritty.desktop" "$raw/linux/Alacritty.desktop"
curl -fsSL -o "$tmp/Alacritty.svg" "$raw/logo/alacritty-term.svg"
cp "$tmp/Alacritty.desktop" /usr/share/applications/Alacritty.desktop
cp "$tmp/Alacritty.svg" /usr/share/pixmaps/Alacritty.svg
desktop-file-install /usr/share/applications/Alacritty.desktop
update-desktop-database
'''
