schema = 1
name = "firefox-snap-remove"
description = "Remove the Ubuntu snap Firefox and let unattended-upgrades take the PPA one"
when = 'all(os = "linux", gui)'

[providers.script]
needs_root  = true
check       = '! snap list firefox >/dev/null 2>&1 && test -f /etc/apt/apt.conf.d/51unattended-upgrades-firefox'
versionless = true
install     = '''
if snap list firefox >/dev/null 2>&1; then snap remove firefox; fi
echo 'Unattended-Upgrade::Allowed-Origins:: "LP-PPA-mozillateam:${distro_codename}";' | tee /etc/apt/apt.conf.d/51unattended-upgrades-firefox >/dev/null
'''
