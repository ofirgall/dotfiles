# Dev-only overrides, merged on top of config.toml into config-dev.generated.toml
# by generate-config.sh. Only the dev herdr (`make run` in the herdr fork) reads it.

# PR board (herdr-pr-board plugin) docked in the sidebar between spaces and agents.
# Repositories: REPOS in `herdr plugin config-dir herdr-pr-board`/config
[[panels]]
id = "prs"
plugin = "herdr-pr-board"
entrypoint = "board"

[ui.sidebar]
sections = ["spaces", "panel:prs", "agents"]

[ui.sidebar.panel.prs]
title = "pull requests"
focus_width = 70
