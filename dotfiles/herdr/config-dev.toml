# Dev-only overrides, merged on top of config.toml into config-dev.generated.toml
# by generate-config.sh. Only the dev herdr (`make run` in the herdr fork) reads it.

# Agent status glyphs (override status_indicators per state, keep single-cell)
# symbols
[ui.status_icons]
blocked = "×"
working = "◐"
done    = "✓"
idle    = "Y"
unknown = "·"
# dots
# [ui.status_icons]
# blocked = "●"
# working = "●"
# done    = "●"
# idle    = "○"
# unknown = "·"

# Agent status in tab labels: glyph prefix, unfocused tabs tinted and dimmed
[ui.tab_status]
enabled = true
inactive_dim = 42 # % fade toward the tab background, 0 = off (agents-status tmux dims to 0.58)
fg = "#11111b" # dark text like tmux design3 @c_text_dark

# Colors from agents-status (core/server.py _STATUS_COLORS)
[ui.tab_status.colors]
blocked = "#cf1313" # WAITING
working = "#fa7900" # INPROGRESS
done    = "#1e88ff" # DONE
idle    = "#15c70c" # IDLE

# Restore agents inside KoalaVim: kv --ai -- <tool> --resume <id>
[session]
resume_command_prefix = ["kv", "--ai", "--"]

# PR board (herdr-pr-board plugin) docked in the sidebar between spaces and agents.
# Repositories: REPOS in `herdr plugin config-dir herdr-pr-board`/config
[[panels]]
id = "prs"
plugin = "herdr-pr-board"
entrypoint = "board"

[ui.sidebar]
sections = ["spaces", "panel:prs", "agents"]

[ui.sidebar.panel.prs]
title = "pull requests"
focus_width = 70
