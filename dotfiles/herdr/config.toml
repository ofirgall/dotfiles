onboarding = false

[theme]
name = "tokyo-night"

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+b"

split_vertical = ""
split_horizontal = ""
close_pane = ""
zoom = ""

new_tab = "alt+t"
switch_tab = "alt+1..9"
previous_tab = "alt+comma"
next_tab = "alt+."
close_tab = "alt+shift+w"

new_workspace = "prefix+shift+n"
workspace_picker = "prefix+w"

focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"

# Nvim-aware binds via herdr-nvim-aware plugin
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-aware.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-aware.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-aware.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-aware.right"

[[keys.command]]
key = "alt+e"
type = "plugin_action"
command = "herdr-nvim-aware.split_v"

[[keys.command]]
key = "alt+o"
type = "plugin_action"
command = "herdr-nvim-aware.split_h"

[[keys.command]]
key = "alt+w"
type = "plugin_action"
command = "herdr-nvim-aware.close"

[[keys.command]]
key = "alt+q"
type = "plugin_action"
command = "herdr-nvim-aware.quit"

[[keys.command]]
key = "alt+z"
type = "plugin_action"
command = "herdr-nvim-aware.zoom"

[[keys.command]]
key = "ctrl+u"
type = "plugin_action"
command = "herdr-nvim-aware.scroll_up"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[ui]
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false
tab_bar_position = "bottom"
prompt_new_tab_name = false
confirm_close = false
