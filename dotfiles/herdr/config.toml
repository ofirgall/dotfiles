onboarding = false

[theme]
name = "tokyo-night"

[terminal]
new_cwd = "follow"

[ui]
pane_outer_borders = false
pane_gaps = false
tab_bar_position = "bottom"
prompt_new_tab_name = false
confirm_close = false
pane_scrollbars = false

[keys]
prefix = "ctrl+b"

split_vertical = "alt+shift+e"
split_horizontal = "prefix+o"
close_pane = ""
zoom = "alt+shift+z"

new_tab = "alt+t"
switch_tab = "alt+1..9"
previous_tab = "alt+comma"
next_tab = "alt+."
close_tab = "alt+shift+w"
move_tab_previous = "alt+shift+comma"
move_tab_next = "alt+shift+."

new_workspace = "prefix+shift+n"
workspace_picker = "prefix+w"

focus_pane_left = "alt+shift+h"
focus_pane_down = "alt+shift+j"
focus_pane_up = "alt+shift+k"
focus_pane_right = "alt+shift+l"

swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"

copy_mode = "alt+c"
last_pane = "alt+minus"

# Nvim-aware binds via herdr-nvim-aware plugin
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-aware.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-aware.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-aware.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-aware.right"

[[keys.command]]
key = "alt+e"
type = "plugin_action"
command = "herdr-nvim-aware.split_v"

[[keys.command]]
key = "alt+o"
type = "plugin_action"
command = "herdr-nvim-aware.split_h"

[[keys.command]]
key = "alt+w"
type = "plugin_action"
command = "herdr-nvim-aware.close"

[[keys.command]]
key = "alt+q"
type = "plugin_action"
command = "herdr-nvim-aware.quit"

[[keys.command]]
key = "alt+z"
type = "plugin_action"
command = "herdr-nvim-aware.zoom"

# Popups
[[keys.command]]
key = "prefix+n"
type = "popup"
command = "ez session note open"
width = "65%"
height = "65%"

