onboarding = false

[theme]
name = "tokyo-night"

[update]
version_check = false

[terminal]
new_cwd = "follow"

[ui]
pane_outer_borders = false
pane_gaps = false
tab_bar_position = "bottom"
prompt_new_tab_name = false
confirm_close = false
pane_scrollbars = false

[keys]
prefix = "ctrl+b"

split_vertical = "alt+shift+e"
split_horizontal = "prefix+o"
close_pane = ""
zoom = "alt+shift+z"

new_tab = "alt+t"
switch_tab = "alt+1..9"
previous_tab = "alt+comma"
next_tab = "alt+."
close_tab = "alt+shift+w"
move_tab_previous = "alt+shift+comma"
move_tab_next = "alt+shift+."

new_workspace = "prefix+shift+n"
workspace_picker = "prefix+w"

focus_pane_left = "alt+shift+h"
focus_pane_down = "alt+shift+j"
focus_pane_up = "alt+shift+k"
focus_pane_right = "alt+shift+l"

swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"

copy_mode = "alt+c"
last_pane = ""
reload_config = "prefix+r"
detach = "prefix+d"
toggle_sidebar = "ctrl+m"
focus_agent = "prefix+ctrl+1..9"
switch_workspace = "prefix+1..9"
close_workspace = "prefix+x"
previous_workspace = "ctrl+,"
next_workspace = "ctrl+."
previous_agent = "ctrl+<"
next_agent = "ctrl+>"


[ui]
sidebar_max_width = 50 # default = 36

[ui.toast]
delivery = "system"

# Nvim-aware binds via herdr-nvim-aware plugin
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-aware.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-aware.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-aware.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-aware.right"

[[keys.command]]
key = "alt+e"
type = "plugin_action"
command = "herdr-nvim-aware.split_v"

[[keys.command]]
key = "alt+o"
type = "plugin_action"
command = "herdr-nvim-aware.split_h"

[[keys.command]]
key = "alt+w"
type = "plugin_action"
command = "herdr-nvim-aware.close"

[[keys.command]]
key = "alt+q"
type = "plugin_action"
command = "herdr-nvim-aware.quit"

[[keys.command]]
key = "alt+z"
type = "plugin_action"
command = "herdr-nvim-aware.zoom"

# Popups
[[keys.command]]
key = "prefix+n"
type = "popup"
command = "ez session note open"
width = "65%"
height = "65%"

[[keys.command]]
key = "ctrl+space"
type = "plugin_action"
command = "herdr-nvim-aware.extrakto"

[[keys.command]]
key = "ctrl+shift+space"
type = "plugin_action"
command = "extrakto-herdr.open"

# Last-tab (like tmux last-window)
[[keys.command]]
key = "alt+`"
type = "shell"
command = "herdr-last-tab"

[[keys.command]]
key = "alt+="
type = "shell"
command = "herdr-last-tab"

[[keys.command]]
key = "alt+-"
type = "shell"
command = "herdr-last-tab"

[[keys.command]]
key = "prefix+b"
type = "popup"
command = "ez --on-enter herdr"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+b"
type = "popup"
command = "ez -a --on-enter herdr"
width = "80%"
height = "80%"

# Navigator
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "herdr-navigator.open"

[[keys.command]]
key = "prefix+-"
type = "plugin_action"
command = "herdr-navigator.jump-back"

# Reviewr
[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

# Automatic rename
[[keys.command]]
key = "prefix+alt+n"
type = "plugin_action"
command = "herdr-automatic-rename.reset"

# Github PRs status
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "herdr-pr-tracker.toggle"
description = "toggle PR tracker board"

[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "herdr-pr-tracker.refresh"
description = "refresh PR status"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "herdr-pr-tracker.view-toggle"
description = "toggle PR view"

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent", "$pr_status", "$pr_id"]]

[ui.sidebar.spaces]
rows = [["state_icon", "$pr_status", "workspace", "$pr_id"],  ["branch", "git_status"]]
