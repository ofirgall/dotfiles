onboarding = false

# ofirkai dark_blue theme — from ofirkai.nvim extras/herdr/ofirkai-darkblue
[theme]
name = "catppuccin" # every token is overridden below, the base does not matter

[theme.custom]
panel_bg      = "#080c10"   # background         (lua/ofirkai/themes/dark_blue.lua)
sidebar_bg    = "#0e141b"   # sidebar_bg #131a24 at 75% (dark_blue.lua)
surface_dim   = "#253b52"   # vert_split_fg — WinSeparator (dark_blue.lua)
surface0      = "#15162a"   # buffer_line.bg — inactive buffers (dark_blue.lua)
surface1      = "#14364e"   # visual_bg / search_bg   (dark_blue.lua)
active_row_bg = "#272942"   # buffer_line.selected_bg #1c1e38 at 105% toward white (dark_blue.lua)
selection_bg  = "#14364e"   # same as surface1
overlay0      = "#5c6fae"   # line_fg #3f478f (LineNr) at 120%, shifted slightly bluer
overlay1      = "#8f908a"   # grey               (lua/ofirkai/design.lua)
text          = "#e9e9e9"   # white #d7d7d7 at 145% toward white (dark_blue.lua)
subtext0      = "#b5b8bb"   # comment_fg #9ca0a4 at 125% toward white (design.lua)
accent        = "#58a8e1"   # aqua shifted to hue 205 (dark_blue.lua #58cbe1)
teal          = "#58cbe1"   # idle unseen: aqua (dark_blue.lua)
blue          = "#909ef5"   # cursor_linenr_fg   (dark_blue.lua)
mauve         = "#a97cfa"   # purple             (dark_blue.lua)
green         = "#9eda26"   # green              (dark_blue.lua)
yellow        = "#f8921a"   # working state: orange (peach, dark_blue.lua)
peach         = "#f8921a"   # orange             (dark_blue.lua)
red           = "#ea417e"   # light_red lifted 20% toward white, for contrast
                             # against herdr's inverted-text pills/badges

[update]
version_check = false

[terminal]
new_cwd = "follow"

[ui]
pane_outer_borders = false
pane_gaps = false
tab_bar_position = "bottom"
prompt_new_tab_name = false
confirm_close = false
pane_scrollbars = false
agent_panel_sort = "priority"
sidebar_max_width = 50 # default = 36
# sidebar_collapsed_mode = "hidden"

[keys]
prefix = "ctrl+b"

split_vertical = "alt+shift+e"
split_horizontal = "prefix+o"
close_pane = ""
zoom = "alt+shift+z"

new_tab = "alt+t"
switch_tab = "alt+1..9"
previous_tab = "alt+comma"
next_tab = "alt+."
close_tab = "alt+shift+w"
move_tab_previous = "alt+shift+comma"
move_tab_next = "alt+shift+."

new_workspace = "prefix+shift+n"
workspace_picker = "prefix+w"

focus_pane_left = "alt+shift+h"
focus_pane_down = "alt+shift+j"
focus_pane_up = "alt+shift+k"
focus_pane_right = "alt+shift+l"

swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"

copy_mode = "alt+c"
last_pane = "ctrl+`"
reload_config = ""
detach = "prefix+d"
toggle_sidebar = "ctrl+m"
focus_agent = "ctrl+alt+1..9"
switch_workspace = "ctrl+1..9"
close_workspace = "prefix+x"
previous_workspace = "ctrl+,"
next_workspace = "ctrl+."
previous_agent = "ctrl+alt+,"
next_agent = "ctrl+alt+."
edit_scrollback = "prefix+c"


[ui.toast]
delivery = "system"

# Nvim-aware binds via herdr-nvim-aware plugin
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-aware.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-aware.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-aware.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-aware.right"

[[keys.command]]
key = "alt+e"
type = "plugin_action"
command = "herdr-nvim-aware.split_v"

[[keys.command]]
key = "alt+o"
type = "plugin_action"
command = "herdr-nvim-aware.split_h"

[[keys.command]]
key = "alt+w"
type = "plugin_action"
command = "herdr-nvim-aware.close"

[[keys.command]]
key = "alt+q"
type = "plugin_action"
command = "herdr-nvim-aware.quit"

[[keys.command]]
key = "alt+z"
type = "plugin_action"
command = "herdr-nvim-aware.zoom"

# Popups
[[keys.command]]
key = "prefix+ctrl+e"
type = "popup"
command = "bash ~/dotfiles/dotfiles/herdr/explain-agent.sh 2>&1; read -r"
width = "80%"
height = "60%"

[[keys.command]]
key = "prefix+ctrl+shift+e"
type = "popup"
command = "bash ~/dotfiles/dotfiles/herdr/read-agent-ansi.sh 2>&1; read -r"
width = "80%"
height = "60%"

[[keys.command]]
key = "prefix+n"
type = "popup"
command = "ez session note open"
width = "65%"
height = "65%"

[[keys.command]]
key = "ctrl+space"
type = "plugin_action"
command = "herdr-nvim-aware.extrakto"

[[keys.command]]
key = "ctrl+shift+space"
type = "plugin_action"
command = "extrakto-herdr.open"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "extrakto-herdr.open-url"

# Last-tab (like tmux last-window)
[[keys.command]]
key = "alt+`"
type = "shell"
command = "herdr-last-tab"

[[keys.command]]
key = "alt+="
type = "shell"
command = "herdr-last-tab"

[[keys.command]]
key = "alt+-"
type = "shell"
command = "herdr-last-tab"

[[keys.command]]
key = "prefix+e"
type = "popup"
command = "ez --on-enter herdr"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+e"
type = "popup"
command = "ez -a --on-enter herdr"
width = "80%"
height = "80%"

# Navigator
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "herdr-navigator.open"

[[keys.command]]
key = "prefix+-"
type = "plugin_action"
command = "herdr-navigator.jump-back"

# Reviewr
[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

# Generate + reload config
[[keys.command]]
key = "prefix+r"
type = "shell"
command = "bash ~/dotfiles/dotfiles/herdr/generate-config.sh \"$(case $(uname) in Darwin) echo mac;; MINGW*|MSYS*|CYGWIN*) echo windows;; *) echo linux;; esac)\" && herdr server reload-config"

# Automatic rename
[[keys.command]]
key = "prefix+alt+n"
type = "plugin_action"
command = "herdr-automatic-rename.reset"

# Github PRs status
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "herdr-pr-tracker.toggle"
description = "toggle PR tracker board"

[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "herdr-pr-tracker.refresh"
description = "refresh PR status"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "herdr-pr-tracker.view-toggle"
description = "toggle PR view"

# Notify (watch a pane's running command, notify on finish)
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "herdr-notify.toggle"
description = "toggle notify when the running command finishes"

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace",
    {token = "$notify", fg = "#f8921a", bold = true},
    {token = "$pr_conflict", fg = "#f38ba8", bold = true},
    {token = "$pr_ci_run",   fg = "#f8921a"},
    {token = "$pr_ci_pass",  fg = "#a6e3a1"},
    {token = "$pr_ci_fail",  fg = "#f38ba8", bold = true},
    {token = "$pr_approved", fg = "#a6e3a1"},
    {token = "$pr_changes",  fg = "#f38ba8", bold = true},
    {token = "$pr_human_threads",  fg = "#f9e2af", bold = true},
    {token = "$pr_bot_threads",  fg = "#f9e2af", bold = true},
    {token = "$pr_merged",   fg = "#cba6f7", bold = true},
    {token = "$pr_queued",   fg = "#f8921a", bold = true},
    {token = "$pr_review",   fg = "#89b4fa", bold = true},
  ],
  ["branch", "git_status"],
]

[ui.sidebar.agents]
rows = [[
  {token = "agent_index", fg = "#8763c8", bold = true}, # ofirkai purple (mauve #a97cfa) at 80%
  "state_icon",
  "workspace",
  "tab"
], [
  "agent",
    {token = "$pr_conflict", fg = "#f38ba8", bold = true},
    {token = "$pr_ci_run",   fg = "#f8921a"},
    {token = "$pr_ci_pass",  fg = "#a6e3a1"},
    {token = "$pr_ci_fail",  fg = "#f38ba8", bold = true},
    {token = "$pr_approved", fg = "#a6e3a1"},
    {token = "$pr_changes",  fg = "#f38ba8", bold = true},
    {token = "$pr_human_threads",  fg = "#f9e2af", bold = true},
    {token = "$pr_bot_threads",  fg = "#f9e2af", bold = true},
    {token = "$pr_merged",   fg = "#cba6f7", bold = true},
    {token = "$pr_queued",   fg = "#f8921a", bold = true},
    {token = "$pr_review",   fg = "#89b4fa", bold = true},
  "$pr_id"
]]
