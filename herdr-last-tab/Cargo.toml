[package]
name = "herdr-last-tab"
version = "0.1.0"
edition = "2021"
description = "Last-tab switcher for herdr (like tmux last-window)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal"] }
